<section class="lm-openring">
    <div class="lm-openring-header">
        <h2 class="lm-openring-title">Articles from blogs I follow</h2>
        <span class="lm-openring-label">via openring</span>
    </div>
    <div class="lm-openring-grid">
        {{range .Articles}}
        <a href="{{.Link}}" class="lm-openring-card" target="_blank" rel="noopener noreferrer">
            <div class="lm-openring-meta">
                <span class="lm-openring-source">{{.SourceTitle}}</span>
                <span class="lm-openring-date">{{.Date | datef "Jan 2, 2006"}}</span>
            </div>
            <h3 class="lm-openring-card-title">{{.Title}}</h3>
        </a>
        {{end}}
    </div>
    <p class="lm-openring-footer">Generated by <a href="https://git.sr.ht/~sircmpwn/openring" target="_blank" rel="noopener noreferrer">openring</a></p>
</section>
