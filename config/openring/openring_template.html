<section class="rd-ring">
    <div class="rd-ring-head">
        <h2 class="rd-label">Articles from blogs I follow</h2>
        <span class="rd-meta">via openring</span>
    </div>
    <div class="rd-ring-grid">
        {{range .Articles}}
        <a href="{{.Link}}" class="rd-ring-card" target="_blank" rel="noopener noreferrer">
            <div class="rd-ring-meta">
                <span class="rd-ring-source">{{.SourceTitle}}</span>
                <span class="rd-ring-date">{{.Date | datef "Jan 2, 2006"}}</span>
            </div>
            <h3 class="rd-ring-card-title">{{.Title}}</h3>
        </a>
        {{end}}
    </div>
    <p class="rd-ring-footer">Generated by <a href="https://git.sr.ht/~sircmpwn/openring" target="_blank" rel="noopener noreferrer">openring</a></p>
</section>
