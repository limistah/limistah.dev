name: Sync Links from Supabase

on:
  schedule:
    # Run daily at 2am UTC (after openring at midnight)
    - cron: '0 2 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  sync-links:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: dev
          token: ${{ secrets.GH_TOKEN }}
      
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      
      - name: Run sync script
        run: go run .github/scripts/sync-links.go
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          LINKSYNC_API_TOKEN: ${{ secrets.LINKSYNC_API_TOKEN }}
      
      - name: Check for changes
        id: check_changes
        run: |
          if [[ -n $(git status --porcelain content/links.md) ]]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Create Pull Request
        if: steps.check_changes.outputs.has_changes == 'true'
        id: create_pr
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GH_TOKEN }}
          commit-message: 'chore: sync links from LinkSync extension'
          branch: linksync-update-${{ github.run_number }}
          base: dev
          title: 'chore: Sync Links from LinkSync'
          body: |
            This PR updates the links page with new links saved via the LinkSync Chrome extension.
            
            - Synced from Supabase database at ${{ github.event.repository.updated_at }}
            - Auto-generated by GitHub Actions
          labels: automated, linksync
          assignees: ${{ github.repository_owner }}
      
      - name: Force merge PR to dev
        if: steps.check_changes.outputs.has_changes == 'true' && steps.create_pr.outputs.pull-request-number
        run: |
          echo "Force merging PR #${{ steps.create_pr.outputs.pull-request-number }} to dev..."
          gh pr merge ${{ steps.create_pr.outputs.pull-request-number }} --squash
          echo "PR has been merged!"
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
      
      - name: Update local dev branch
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          git fetch origin dev
          git checkout dev
          git pull origin dev
      
      - name: Create PR from dev to main
        if: steps.check_changes.outputs.has_changes == 'true'
        id: create_main_pr
        continue-on-error: true
        run: |
          gh pr create \
            --base main \
            --head dev \
            --title "chore: Sync dev to main (linksync update)" \
            --body "Auto-sync from dev to main after linksync update" \
            --label "automated"
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
      
      - name: Force merge PR to main
        if: steps.check_changes.outputs.has_changes == 'true' && steps.create_main_pr.outcome == 'success'
        run: |
          PR_NUMBER=$(gh pr list --head dev --base main --json number --jq '.[0].number')
          if [ -n "$PR_NUMBER" ]; then
            echo "Force merging PR #$PR_NUMBER to main..."
            gh pr merge $PR_NUMBER --merge
            echo "PR has been merged!"
          else
            echo "Error: Could not find PR number"
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
