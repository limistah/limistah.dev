{{- define "main" }}

<div class="lm-page-outer">

    <div class="lm-page-header">
        <h1 class="lm-page-title">{{ .Title }}</h1>
        {{- with .Description }}
        <p class="lm-page-lede">{{ . }}</p>
        {{- end }}
        {{- $timestamps := partial "page_timestamps.html" . }}
        <p class="lm-simple-meta">{{- with $timestamps }}<span class="lm-meta-group" role="group" aria-label="Page timestamps">{{ . | safeHTML }}</span>{{- end }}</p>
    </div>

    <div class="lm-readings-content">
        {{ .Content }}
    </div>

</div>

{{- end }}
