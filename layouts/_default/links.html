{{- define "main" }}

<div class="lm-page-outer">

    <div class="lm-links-header">
        <h1 class="lm-page-title">{{ .Title }}</h1>
        {{- with .Description }}
        <p class="lm-page-lede">{{ . }}</p>
        {{- end }}
        <div class="lm-links-filter-wrap">
            <span class="lm-filter-icon" aria-hidden="true">/</span>
            <input type="text" id="lm-links-filter" class="lm-filter-input"
                   placeholder="Filter resources..." autocomplete="off" spellcheck="false">
        </div>
        <p class="lm-links-count" id="lm-links-count"></p>
    </div>

    <div class="lm-links-content" id="lm-links-content">
        {{ .Content }}
    </div>

</div>

<script>
(function () {
    var input   = document.getElementById('lm-links-filter');
    var content = document.getElementById('lm-links-content');
    var countEl = document.getElementById('lm-links-count');

    if (!input || !content) return;

    /* Group h3 headings with their following ol into logical sections */
    var headings = Array.from(content.querySelectorAll('h3'));
    var total    = content.querySelectorAll('li').length;

    function update() {
        var q = input.value.trim().toLowerCase();
        var visible = 0;

        headings.forEach(function (h3) {
            var headingMatch = h3.textContent.toLowerCase().includes(q);
            var ol = h3.nextElementSibling;
            while (ol && ol.tagName !== 'OL') ol = ol.nextElementSibling;

            var items = ol ? Array.from(ol.querySelectorAll('li')) : [];
            var anyMatch = false;

            if (!q) {
                h3.style.display = '';
                if (ol) ol.style.display = '';
                items.forEach(function (li) { li.style.display = ''; });
                visible += items.length;
                return;
            }

            items.forEach(function (li) {
                var show = headingMatch || li.textContent.toLowerCase().includes(q);
                li.style.display = show ? '' : 'none';
                if (show) { anyMatch = true; visible++; }
            });

            var show = headingMatch ? true : anyMatch;
            h3.style.display = show ? '' : 'none';
            if (ol) ol.style.display = show ? '' : 'none';
        });

        countEl.textContent = q ? (visible + ' of ' + total + ' resources') : '';
    }

    input.addEventListener('input', update);
})();
</script>

{{- end }}
