{{- define "main" }}

<div class="lm-now-outer">
    <div class="lm-now-inner">

        <header class="lm-now-header">
            <h1 class="lm-now-title">{{ .Title }}</h1>
            {{- with .Description }}
            <p class="lm-now-subtitle">{{ . }}</p>
            {{- end }}
            {{- $timestamps := partial "page_timestamps.html" . }}
            <p class="lm-now-updated">{{- with $timestamps }}<span class="lm-meta-group" role="group" aria-label="Page timestamps">{{ . | safeHTML }}</span>{{- end }}</p>
            {{- partial "notbyai.html" . }}
        </header>

        <div class="lm-now-content">
            {{ .Content }}
        </div>

    </div>
</div>

{{- end }}
