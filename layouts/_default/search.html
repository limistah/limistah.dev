{{- define "main" }}
<div class="rd-page">
    <h1 class="rd-title">Search</h1>
    <p class="rd-intro">Everything on the site, as you type.</p>
    <div id="searchbox">
        <input id="searchInput" class="rd-input rd-input--wide" autofocus placeholder="{{ .Params.placeholder | default "Search…" }}" aria-label="search" type="search" autocomplete="off" maxlength="64">
    </div>
    <ul id="searchResults" class="rd-search-results" aria-label="search results"></ul>
    <div class="rd-utilities"><a href="/writing/">All writing &rarr;</a><a href="/tags/">Browse tags &rarr;</a><a href="/archive/">Archive &rarr;</a></div>
</div>
{{- end }}
